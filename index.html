<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة عملاء الفرنشايز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#211D18;
    --bg:#EDE8DC;
    --surface:#FFFFFF;
    --surface-2:#F6F2E8;
    --accent:#A85A2A;
    --accent-dark:#7C3F1B;
    --sage:#4E5A3E;   --sage-bg:#E7EBDE;
    --danger:#9B3B34; --danger-bg:#F3E1DE;
    --wait:#8A6A2A;   --wait-bg:#F1E7CC;
    --hesit:#5B5A82;  --hesit-bg:#E7E6F0;
    --good:#5D7290;   --good-bg:#E4E9F0;
    --repeat:#3B6E8F;    --repeat-bg:#DCEAF2;
    --apology:#8A5A3B;   --apology-bg:#F0E3D6;
    --dismissed:#5A564C; --dismissed-bg:#E7E4DC;
    --muted:#87806E;
    --border:#DBD3C0;
    --gold:#B98A2E;
    --radius-s:4px;
    --radius-m:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Almarai','Tahoma',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,h4,.brand-mark,.nav-label,.stat-num,button{
    font-family:'Tajawal','Tahoma',sans-serif;
  }
  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--ink); color:#EDE8DC;
    display:flex; flex-direction:column; padding:26px 18px; gap:22px;
  }
  .brand-mark{ font-size:19px; font-weight:900; line-height:1.35; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .brand-title-text{ display:block; }
  .brand-mark span{ display:block; font-family:'Almarai',sans-serif; font-size:12px; font-weight:400; color:#B8B0A0; margin-top:4px; }
  .nav{ display:flex; flex-direction:column; gap:4px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-s);
    cursor:pointer; color:#D8D2C4; font-size:14px; font-weight:700; transition:background .15s ease;
    border:none; background:none; text-align:right; width:100%; font-family:'Tajawal',sans-serif;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); }
  .nav-item.active{ background:var(--accent); color:#fff; }
  .nav-group{ display:flex; flex-direction:column; }
  .nav-subitems{ display:flex; flex-direction:column; gap:2px; margin:2px 14px 2px 0; padding-right:12px; border-right:2px solid rgba(255,255,255,0.15); }
  .nav-subitem{ font-size:12.5px; padding:8px 12px; }
  .nav-item.nav-disabled{ opacity:.32; cursor:not-allowed; }
  .sidebar-foot{ margin-top:auto; font-size:11px; color:#8B846F; line-height:1.6; }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:26px 36px 40px; max-width:1260px; }
  .link-btn{
    background:none; border:none; color:var(--accent-dark); font-weight:700; font-size:12.5px;
    cursor:pointer; font-family:'Tajawal',sans-serif; padding:0; text-decoration:underline;
  }

  /* ---------- Top-left user menu ---------- */
  .user-menu-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .global-search-wrap{ position:relative; flex:1; max-width:360px; min-width:200px; }
  .global-search-wrap input{
    width:100%; padding:9px 14px; border-radius:20px; border:1.5px solid var(--border);
    background:var(--surface); font-family:'Almarai',sans-serif; font-size:12.5px;
  }
  .global-search-wrap input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .global-search-dropdown{
    position:absolute; top:calc(100% + 6px); right:0; left:0; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; box-shadow:0 10px 26px rgba(0,0,0,.14); z-index:50; max-height:320px; overflow-y:auto;
  }
  .global-search-item{ padding:10px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12.5px; border-bottom:1px solid var(--border); }
  .global-search-item:last-child{ border-bottom:none; }
  .global-search-item:hover{ background:var(--surface-2); }
  .global-search-empty{ padding:14px; color:var(--muted); font-size:12.5px; text-align:center; }
  .voice-cmd-btn{
    background:var(--surface); border:1.5px solid var(--border); border-radius:50%; width:36px; height:36px;
    cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .voice-cmd-btn.listening{ background:var(--danger-bg); border-color:var(--danger); animation:pulseVoice 1s infinite; }
  .notif-badge{
    position:absolute; top:-4px; left:-4px; background:var(--danger); color:#fff; font-size:10px; font-weight:900;
    border-radius:50%; width:16px; height:16px; display:flex; align-items:center; justify-content:center; font-family:'Tajawal',sans-serif;
  }
  .attach-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:5px 6px 5px 12px; font-size:11.5px; margin:0 4px 6px 0; }
  .attach-chip button{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:13px; font-weight:700; }
  .attendee-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--sage-bg); color:var(--sage); border-radius:20px; padding:5px 6px 5px 12px; font-size:11.5px; margin:0 4px 6px 0; font-weight:700; }
  .attendee-chip button{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:13px; font-weight:700; }
  @keyframes pulseVoice{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
  .user-menu{ position:relative; }
  .user-menu-trigger{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:24px; padding:6px 14px 6px 8px; cursor:pointer; font-family:'Tajawal',sans-serif;
  }
  .user-menu-trigger .uname{ font-size:12.5px; font-weight:700; color:var(--ink); }
  .user-menu-trigger .chevron{ width:12px; height:12px; color:var(--muted); transition:transform .15s ease; }
  .user-menu.open .user-menu-trigger .chevron{ transform:rotate(180deg); }
  .user-menu-dropdown{
    position:absolute; top:calc(100% + 8px); left:0; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 10px 28px rgba(0,0,0,.16); padding:18px 16px; min-width:180px;
    display:flex; flex-direction:column; align-items:center; gap:10px; z-index:40;
  }
  .user-menu-dropdown.hidden{ display:none; }
  .user-menu-dropdown .uname{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .user-menu-dropdown .logout-btn{
    width:100%; background:var(--danger-bg); color:var(--danger); border:none; border-radius:8px;
    padding:9px 0; font-family:'Tajawal',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .user-menu-dropdown .logout-btn:hover{ background:var(--danger); color:#fff; }
  .user-menu-dropdown .manage-link{ font-size:11.5px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  .topbar h1{ font-size:22px; font-weight:900; }
  .topbar p{ color:var(--muted); font-size:13px; margin-top:4px; }
  .btn{ font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px; border:none; border-radius:var(--radius-s); padding:11px 20px; cursor:pointer; transition:transform .1s, background .15s; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border); }
  .btn-ghost:hover{ border-color:var(--ink); }
  .btn-wa{ background:var(--sage); color:#fff; }
  .btn-wa:hover{ background:#3c4630; }
  .btn-sm{ padding:7px 13px; font-size:12px; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---------- Stat + brand cards ---------- */
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px; }
  .stat-num{ font-size:23px; font-weight:900; color:var(--accent-dark); }
  .stat-label{ font-size:12px; color:var(--muted); margin-top:3px; }

  .section-label{ font-size:12.5px; font-weight:700; color:var(--muted); margin:4px 0 8px; font-family:'Tajawal',sans-serif; }
  .brand-cards{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  .brand-card{
    flex:1; min-width:150px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-m);
    padding:14px 16px; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .brand-card:hover{ border-color:var(--accent); }
  .brand-card.active{ border-color:var(--accent); background:var(--surface-2); }
  .brand-card .bname{ font-family:'Tajawal',sans-serif; font-weight:700; font-size:13.5px; }
  .brand-card .bcount{ font-size:20px; font-weight:900; color:var(--accent-dark); margin-top:4px; }

  /* ---------- Filters ---------- */
  .filters{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .filters input, .filters select{
    font-family:'Almarai',sans-serif; padding:9px 12px; border-radius:var(--radius-s);
    border:1.5px solid var(--border); background:var(--surface); font-size:13px; color:var(--ink);
  }
  .filters input{ min-width:210px; }
  .filters input:focus, .filters select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  /* ---------- Table ---------- */
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:760px; }
  thead th{ text-align:right; font-family:'Tajawal',sans-serif; font-size:11.5px; font-weight:700; color:var(--muted); background:var(--surface-2); padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:12px 14px; font-size:13px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition:filter .12s; }
  .file-id{ font-family:'Tajawal',sans-serif; font-weight:700; color:var(--accent-dark); background:var(--surface-2); border-radius:6px; padding:3px 9px; font-size:12px; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; font-family:'Tajawal',sans-serif; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .badge.b-done{ background:var(--sage-bg); color:var(--sage); }
  .badge.b-pending{ background:var(--wait-bg); color:var(--wait); }
  .badge.b-nope{ background:var(--danger-bg); color:var(--danger); }
  .badge.b-hesit{ background:var(--hesit-bg); color:var(--hesit); }
  .badge.b-repeat{ background:var(--repeat-bg); color:var(--repeat); }
  .badge.b-apology{ background:var(--apology-bg); color:var(--apology); }
  .badge.b-dismissed{ background:var(--dismissed-bg); color:var(--dismissed); }
  .badge.b-excellent{ background:var(--sage-bg); color:var(--sage); }
  .badge.b-vgood{ background:var(--wait-bg); color:var(--wait); }
  .badge.b-good{ background:var(--good-bg); color:var(--good); }
  .badge.b-none{ background:var(--surface-2); color:var(--muted); }
  .empty{ text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }
  .share-icon-btn{
    background:var(--sage-bg); color:var(--sage); border:none; border-radius:6px; padding:6px 10px;
    font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif;
  }
  .share-icon-btn:hover{ background:var(--sage); color:#fff; }

  /* ---------- Form ---------- */
  .form-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:24px 28px; max-width:740px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 18px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:12px; font-weight:700; color:var(--ink); font-family:'Tajawal',sans-serif; }
  .field input, .field select, .field textarea{
    font-family:'Almarai',sans-serif; padding:10px 12px; border-radius:var(--radius-s);
    border:1.5px solid var(--border); font-size:13px; background:var(--surface); color:var(--ink);
  }
  .radio-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-chip{ border:1.5px solid var(--border); border-radius:20px; padding:8px 16px; font-size:12.5px; cursor:pointer; user-select:none; transition:all .12s; }
  .radio-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .circle-row{ display:flex; gap:22px; align-items:center; }
  .circle-option{ display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px; }
  .circle-option input[type="radio"]{ width:19px; height:19px; accent-color:var(--accent); cursor:pointer; }
  .phone-row{ display:flex; gap:8px; }
  .phone-row select{ flex:0 0 140px; }
  .phone-row input{ flex:1; }
  .form-actions{ margin-top:20px; display:flex; gap:10px; }
  .readonly-box{ background:var(--surface-2); border:1.5px solid var(--border); border-radius:var(--radius-s); padding:10px 12px; font-size:13px; color:var(--muted); }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(33,29,24,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.hidden{ display:none; }
  .modal{ background:var(--surface); border-radius:var(--radius-m); width:100%; max-width:760px; max-height:88vh; overflow-y:auto; }
  .modal-head{ padding:20px 26px 0; position:sticky; top:0; background:var(--surface); z-index:2; }
  .modal-head-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .modal-head h2{ font-size:18px; font-weight:900; }
  .modal-head .sub{ color:var(--muted); font-size:12px; margin-top:3px; }
  .modal-close{ background:var(--surface-2); border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:16px; color:var(--ink); flex-shrink:0; }
  .tabs{ display:flex; gap:4px; margin-top:16px; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab-btn{ background:none; border:none; padding:10px 14px; font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
  .tab-btn.active{ color:var(--accent-dark); border-bottom-color:var(--accent); }
  .modal-body{ padding:20px 26px 26px; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; }
  .info-item .k{ font-size:11px; color:var(--muted); font-weight:700; font-family:'Tajawal',sans-serif; }
  .info-item .v{ font-size:13.5px; margin-top:2px; }
  .log-entry{ border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .log-entry .row1{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .log-entry .date{ font-size:11px; color:var(--muted); }
  .log-entry .note{ font-size:13px; line-height:1.55; }
  .add-log-box{ border:1.5px dashed var(--border); border-radius:8px; padding:14px; margin-top:14px; }
  .add-log-box h4{ font-size:12.5px; margin-bottom:10px; }
  .choice-row{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .modal textarea{ width:100%; margin-bottom:10px; font-family:'Almarai',sans-serif; padding:8px 10px; border-radius:6px; border:1.5px solid var(--border); font-size:13px; }

  /* ---------- Reports ---------- */
  .report-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
  .report-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px 18px; }
  .report-card h3{ font-size:13px; margin-bottom:12px; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:12px; }
  .bar-row .lbl{ width:96px; flex-shrink:0; color:var(--ink); }
  .bar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .bar-count{ width:22px; text-align:left; color:var(--muted); font-size:11.5px; }

  /* ---------- Users ---------- */
  .user-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .user-card{ background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-m); padding:16px; }
  .user-card.current{ border-color:var(--accent); }
  .user-card .uname{ font-family:'Tajawal',sans-serif; font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:8px; }
  .user-card .umeta{ font-size:11.5px; color:var(--muted); margin:4px 0 10px; }
  .add-user-form{ display:flex; gap:10px; margin-bottom:22px; max-width:480px; flex-wrap:wrap; }
  .add-user-form input[type="text"]{ flex:1; min-width:160px; padding:10px 12px; border-radius:var(--radius-s); border:1.5px solid var(--border); font-family:'Almarai',sans-serif; }
  .avatar{ width:28px; height:28px; border-radius:50%; object-fit:cover; background:var(--surface-2); flex-shrink:0; }
  .avatar-lg{ width:56px; height:56px; border-radius:50%; object-fit:cover; background:var(--surface-2); }
  .avatar-placeholder{ width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; font-family:'Tajawal',sans-serif; }
  .avatar-placeholder-lg{ width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; font-family:'Tajawal',sans-serif; }
  .file-upload-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .sidebar-logo{ max-width:100%; max-height:52px; object-fit:contain; margin-bottom:2px; }

  /* ---------- Share page ---------- */
  .share-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:22px 26px; max-width:600px; margin-bottom:18px; }
  .share-card h3{ font-size:14.5px; margin-bottom:8px; }
  .share-card p{ font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:14px; }

  /* ---------- Login ---------- */
  #loginScreen{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  #loginScreen.hidden{ display:none; }
  .login-card{ background:var(--surface); border-radius:var(--radius-m); padding:34px 32px; width:100%; max-width:360px; text-align:center; }
  .login-card img{ max-width:100%; max-height:60px; object-fit:contain; margin-bottom:6px; }
  .login-card h1{ font-size:19px; font-weight:900; margin-bottom:4px; }
  .login-card p{ font-size:12.5px; color:var(--muted); margin-bottom:22px; }
  .login-card .field{ text-align:right; margin-bottom:14px; }
  .login-card input{ width:100%; padding:11px 13px; border-radius:var(--radius-s); border:1.5px solid var(--border); font-family:'Almarai',sans-serif; font-size:13.5px; }
  .login-card .btn{ width:100%; margin-top:6px; }
  .login-error{ color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px; }

  /* ---------- Quick status menu & row tints ---------- */
  .kebab-btn{ background:var(--surface-2); border:1px solid var(--border); border-radius:6px; width:30px; height:30px; cursor:pointer; font-size:15px; color:var(--ink); line-height:1; }
  .kebab-btn:hover{ background:var(--border); }
  .status-menu{ position:absolute; top:100%; left:0; margin-top:4px; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.14); z-index:20; min-width:180px; overflow:hidden; }
  .status-menu-item{ padding:9px 14px; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .status-menu-item:hover{ background:var(--surface-2); }
  .status-menu-section-label{ font-size:10px; color:var(--muted); font-weight:700; padding:8px 14px 3px; font-family:'Tajawal',sans-serif; }
  .status-menu-divider{ height:1px; background:var(--border); margin:4px 0; }
  tbody tr.row-tint-done{ background:var(--sage-bg); }
  tbody tr.row-tint-pending{ background:var(--wait-bg); }
  tbody tr.row-tint-nope{ background:var(--danger-bg); }
  tbody tr.row-tint-hesit{ background:var(--hesit-bg); }
  tbody tr.row-tint-repeat{ background:var(--repeat-bg); }
  tbody tr.row-tint-apology{ background:var(--apology-bg); }
  tbody tr.row-tint-dismissed{ background:var(--dismissed-bg); }
  tbody tr:hover{ filter:brightness(0.96); }

  /* ---------- Side panel (message content) ---------- */
  .side-overlay{ position:fixed; inset:0; background:rgba(33,29,24,.45); z-index:60; }
  .side-overlay.hidden{ display:none; }
  .side-panel{ position:absolute; top:0; right:0; height:100%; width:400px; max-width:92vw; background:var(--surface); box-shadow:-10px 0 28px rgba(0,0,0,.18); overflow-y:auto; padding:24px; animation:slideIn .18s ease; }
  @keyframes slideIn{ from{ transform:translateX(20px); opacity:0; } to{ transform:translateX(0); opacity:1; } }

  /* ---------- List manager (settings) ---------- */
  .list-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .list-chip{ background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:6px 8px 6px 14px; font-size:12.5px; display:flex; align-items:center; gap:8px; }
  .list-chip button{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:15px; font-weight:700; line-height:1; }
  .list-add-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .list-add-row input{ padding:8px 10px; border-radius:6px; border:1.5px solid var(--border); font-family:'Almarai',sans-serif; font-size:12.5px; }
  .drag-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; margin-bottom:6px;
    cursor:grab; user-select:none; border:1px solid transparent;
  }
  .drag-row.dragging{ opacity:.4; }
  .drag-row.drag-over{ border-top:2px solid var(--accent); }
  .drag-handle{ font-size:14px; color:var(--muted); flex-shrink:0; }
  .drag-label{ flex:1; font-size:13px; font-weight:700; font-family:'Tajawal',sans-serif; }
  .drag-remove{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:15px; font-weight:700; flex-shrink:0; }
  .required-star{ color:var(--danger); font-weight:900; margin-left:2px; }

  /* ---------- User account cards ---------- */
  .user-edit-form{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .user-edit-form input{ padding:8px 10px; border-radius:6px; border:1.5px solid var(--border); font-family:'Almarai',sans-serif; font-size:12.5px; }

  @media print{
    .sidebar, .user-strip, .filters, .topbar button, .btn{ display:none !important; }
    .main{ padding:0; max-width:100%; }
    body{ background:#fff; }
  }
  @media (max-width:900px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:14px 18px; gap:14px; overflow-x:auto; }
    .brand-mark{ display:none; }
    .nav{ flex-direction:row; }
    .sidebar-foot{ display:none; }
    .main{ padding:20px 16px; }
    .form-grid{ grid-template-columns:1fr; }
    .report-grid{ grid-template-columns:1fr; }
    .info-grid{ grid-template-columns:1fr; }
  }
</style>

/* ============== Default lists (mutable — user can add/edit/delete in Settings) ============== */
const ALL_NAV_VIEWS = [

];
const DEFAULT_USER_PERMISSIONS = ['list','clients','contacts','brands','brandreport','meetings','meetingsreport','comms','responsecategories','messages','sentmessages','contactlog','tasks','tasksreport','report'];

const DEFAULT_LISTS = {
  brands: ["مشاوي صح","حاشي صح","فطورك صح"],
  countries: [
    {name:"السعودية", code:"+966"},
    {name:"الإمارات", code:"+971"},
    {name:"عُمان", code:"+968"},
    {name:"الأردن", code:"+962"},
    {name:"مصر", code:"+20"}
  ],
  entityTypes: ["شركة","مؤسسة","فرد"],
  commStatuses: ["لم يتم الرد 1","لم يتم الرد 2","تم الرد إيجابي","تم الرد متردد","معتذر"],
  ratingOptions: ["ممتاز","جيد جدا","جيد"],
  heardAboutOptions: ["صديق","التواصل الاجتماعي"],
  capitalOptions: ["من 500 ألف إلى مليون ريال","مليون ريال فأكثر"],
  fundingOptions: ["تمويل شخصي","تمويل من البنوك"],
  targetRegions: ["الرياض","جدة","الدمام","مكة المكرمة","المدينة المنورة"],
  meetingTypes: ["اجتماع عملاء"],
  meetingLocations: ["المكتب الرئيسي"],
  messageTemplates: [
    { id:"t1", title:"رسالة تعريفية", text:'مرحباً {name}، نتواصل معكم بخصوص طلب الحصول على فرنشايز علامة "{brand}". يسعدنا الإجابة عن أي استفسار.', color:"sage" },
    { id:"t2", title:"متابعة", text:"مرحباً {name}، نود المتابعة معكم بخصوص طلبكم لعلامة \"{brand}\" — هل توفر لديكم وقت للحديث قريباً؟", color:"wait" },
    { id:"t3", title:"تذكير", text:"مرحباً {name}، نذكّركم بطلبكم الخاص بعلامة \"{brand}\"، بانتظار ردكم.", color:"hesit" }
  ]
};
const TEMPLATE_COLORS = ["sage","wait","hesit","repeat","apology","good"];
let BRANDS = [], COUNTRIES = [], ENTITY_TYPES = [], COMM_STATUSES = [], RATING_OPTIONS = [], MESSAGE_TEMPLATES = [];
let HEARD_ABOUT_OPTIONS = [], CAPITAL_OPTIONS = [], FUNDING_OPTIONS = [], TARGET_REGIONS = [], MEETING_TYPES = [], MEETING_LOCATIONS = [];
let meetings = [];
let contacts = [];
let editingContactId = null;
let navLabelOverrides = {};
let contactsSelected = new Set();
let tasks = [];
let editingTaskId = null;
let tasksFilter = { status:'', assignedTo:'' };
let tasksReportFilter = { fromDate:'', toDate:'', assignedTo:'', status:'' };
const TASK_STATUSES = ['قيد التنفيذ', 'منجزة'];

/* ============== State ============== */
let clients = [];
let users = [];
let currentUserId = null;
let currentView = "list";
let activeClientId = null;
let activeModalTab = "info";
let clientEditMode = false;
let pendingRatingCat = null;
let pendingCommStatus = null;
let openStatusMenuFor = null;
let userMenuOpen = false;
let globalSearchQuery = '';
let globalSearchOpen = false;
let notifOpen = false;
let editingMeetingId = null;
let meetingsFilter = { fromDate:'', toDate:'', type:'', location:'' };
let voiceRecognition = null;
let voiceListening = false;
let sentMessages = [];
let sentMessagesFilter = { channel:'' };
let contactLogFilter = { fromDate:'', toDate:'', includeStatus:true, includeMessages:true, channel:'' };
let commsSelected = new Set();
let sendMessagesSelected = new Set();
let editingUserId = null;
let listFilters = { q:"", brand:"", status:"", rating:"", assignedTo:"" };
let brandReportFilter = { brand:"" };
let commFilters = { q:"", status:"", rating:"" };
let addFormState = { entityType:"شركة", triedFranchise:null, brand:"", initialRating:"" };
let systemLogo = null;

/* ============== Storage (localStorage: works offline on PC & in browser) ============== */
function loadData(){
  try{ clients = JSON.parse(localStorage.getItem('fcrm_clients') || '[]'); }catch(e){ clients = []; }
  try{ users = JSON.parse(localStorage.getItem('fcrm_users') || '[]'); }catch(e){ users = []; }
  try{ sentMessages = JSON.parse(localStorage.getItem('fcrm_sent_messages') || '[]'); }catch(e){ sentMessages = []; }
  // migrate/clean up any legacy user records that predate username+password accounts
  const beforeCount = users.length;
  users = users.filter(u => u && typeof u.username === 'string' && u.username && typeof u.password === 'string' && u.password);
  if(users.length !== beforeCount) saveUsers();
  // migrate: any user created before roles existed becomes super_admin (avoids lockout)
  let rolesMigrated = false;
  users.forEach(u=>{
    if(!u.role){
      u.role = 'super_admin';
      u.permissions = ALL_NAV_VIEWS.map(v=>v.id);
      rolesMigrated = true;
    }
  });
  if(rolesMigrated) saveUsers();
  systemLogo = localStorage.getItem('fcrm_logo') || null;
  let lists = null;
  try{ lists = JSON.parse(localStorage.getItem('fcrm_lists')); }catch(e){ lists = null; }
  lists = lists || {};
  BRANDS = lists.brands || DEFAULT_LISTS.brands.slice();
  COUNTRIES = lists.countries || DEFAULT_LISTS.countries.slice();
  ENTITY_TYPES = lists.entityTypes || DEFAULT_LISTS.entityTypes.slice();
  COMM_STATUSES = lists.commStatuses || DEFAULT_LISTS.commStatuses.slice();
  STATUS_COLORS = lists.statusColors || {};
  let statusColorsMigrated = false;
  COMM_STATUSES.forEach(s=>{
    if(!STATUS_COLORS[s]){ assignStatusColor(s); statusColorsMigrated = true; }
  });
  RATING_OPTIONS = lists.ratingOptions || DEFAULT_LISTS.ratingOptions.slice();
  MESSAGE_TEMPLATES = lists.messageTemplates || DEFAULT_LISTS.messageTemplates.slice();
  let templateColorsMigrated = false;
  MESSAGE_TEMPLATES.forEach((t, idx)=>{
    if(!t.color){ t.color = TEMPLATE_COLORS[idx % TEMPLATE_COLORS.length]; templateColorsMigrated = true; }
  });
  HEARD_ABOUT_OPTIONS = lists.heardAboutOptions || DEFAULT_LISTS.heardAboutOptions.slice();
  CAPITAL_OPTIONS = lists.capitalOptions || DEFAULT_LISTS.capitalOptions.slice();
  FUNDING_OPTIONS = lists.fundingOptions || DEFAULT_LISTS.fundingOptions.slice();
  TARGET_REGIONS = lists.targetRegions || DEFAULT_LISTS.targetRegions.slice();
  MEETING_TYPES = lists.meetingTypes || DEFAULT_LISTS.meetingTypes.slice();
  MEETING_LOCATIONS = lists.meetingLocations || DEFAULT_LISTS.meetingLocations.slice();
  try{ meetings = JSON.parse(localStorage.getItem('fcrm_meetings') || '[]'); }catch(e){ meetings = []; }
  try{ tasks = JSON.parse(localStorage.getItem('fcrm_tasks') || '[]'); }catch(e){ tasks = []; }
  try{ contacts = JSON.parse(localStorage.getItem('fcrm_contacts') || '[]'); }catch(e){ contacts = []; }
  try{ navLabelOverrides = JSON.parse(localStorage.getItem('fcrm_nav_labels') || '{}'); }catch(e){ navLabelOverrides = {}; }

  // one-time migration: upgrade any earlier default communication-status set to the current one
  const KNOWN_OLD_COMM_STATUS_SETS = [
    ["تم الرد","لم يتم الرد","تم الاعتماد","متردد"],
    ["تم الرد","لم يتم الرد","تكرار المكالمة","تم التأكيد","معتذر","صرف نظر"]
  ];
  if(KNOWN_OLD_COMM_STATUS_SETS.some(set => JSON.stringify(COMM_STATUSES) === JSON.stringify(set))){
    COMM_STATUSES = DEFAULT_LISTS.commStatuses.slice();
    saveLists();
  }
  if(templateColorsMigrated) saveLists();
  if(statusColorsMigrated) saveLists();
}
function saveClients(){ localStorage.setItem('fcrm_clients', JSON.stringify(clients)); }
function saveSentMessages(){ localStorage.setItem('fcrm_sent_messages', JSON.stringify(sentMessages)); }
function logSentMessage(c, channel, templateTitle, text){
  sentMessages.push({
    id: 'm'+Date.now()+Math.random().toString(36).slice(2,6),
    date: new Date().toISOString(),
    clientId: c.id,
    clientName: c.name,
    clientPhone: (c.countryCode||'') + ' ' + (c.phone||''),
    channel,
    templateTitle: templateTitle || '',
    text,
    byUser: currentUserName() || ''
  });
  saveSentMessages();
}
function saveUsers(){ localStorage.setItem('fcrm_users', JSON.stringify(users)); }
function saveLogo(){ if(systemLogo) localStorage.setItem('fcrm_logo', systemLogo); else localStorage.removeItem('fcrm_logo'); }
function saveLists(){
  localStorage.setItem('fcrm_lists', JSON.stringify({
    brands:BRANDS, countries:COUNTRIES, entityTypes:ENTITY_TYPES, commStatuses:COMM_STATUSES, ratingOptions:RATING_OPTIONS, messageTemplates:MESSAGE_TEMPLATES,
    heardAboutOptions:HEARD_ABOUT_OPTIONS, capitalOptions:CAPITAL_OPTIONS, fundingOptions:FUNDING_OPTIONS,
    targetRegions:TARGET_REGIONS, meetingTypes:MEETING_TYPES, meetingLocations:MEETING_LOCATIONS, statusColors:STATUS_COLORS
  }));
}
function saveMeetings(){ localStorage.setItem('fcrm_meetings', JSON.stringify(meetings)); }
function saveTasks(){ localStorage.setItem('fcrm_tasks', JSON.stringify(tasks)); }
function saveContacts(){ localStorage.setItem('fcrm_contacts', JSON.stringify(contacts)); }

/* ============== Login (per-account username/password) ============== */
function applyLogoDisplays(){
  const sidebarMark = document.getElementById('sidebarBrandMark');
  if(sidebarMark){
    sidebarMark.innerHTML = systemLogo
      ? `<img src="${systemLogo}" class="sidebar-logo" alt="شعار النظام"><span class="brand-title-text">إدارة عملاء الفرنشايز<span>سجل العملاء والمتابعة</span></span>`
      : `إدارة عملاء الفرنشايز<span>سجل العملاء والمتابعة</span>`;
  }
}
function logoTagHtml(){
  return systemLogo ? `<img src="${systemLogo}" style="max-width:100%;max-height:60px;object-fit:contain;margin-bottom:6px;">` : '';
}
function renderLoginScreen(){
  const card = document.getElementById('loginCard');
  if(users.length === 0){
    card.innerHTML = `
      ${logoTagHtml()}
      <h1>إنشاء أول حساب</h1>
      <p>لا يوجد مستخدمون بعد. أنشئ أول حساب لتسجيل الدخول وإدارة النظام.</p>

  if(STATUS_COLORS[status]) return;

  const usedCount = Object.keys(STATUS_COLORS).length;

}
function cycleStatusColor(status){

async function shareWorkbookOrDownload(wb, filename, shareTitle){
  try{
    const arrayBuffer = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([arrayBuffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title: shareTitle || filename });
      return;
    }
  }catch(err){
    if(err && err.name === 'AbortError') return;
  }
  XLSX.writeFile(wb, filename);
  alert('تم تنزيل ملف Excel — أرفقه يدوياً في محادثة واتساب لإرساله (مشاركة الملفات مباشرة عبر واتساب غير مدعومة في هذا المتصفح).');
}

function wireDragReorder(containerId, arr, onReorder){
  const container = document.getElementById(containerId);
  if(!container) return;
  let dragFromIdx = null;
  container.querySelectorAll('[data-dragidx]').forEach(row=>{
    row.addEventListener('dragstart', (e)=>{
      dragFromIdx = parseInt(row.dataset.dragidx, 10);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      container.querySelectorAll('.drag-row').forEach(r=> r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', (e)=>{
      e.preventDefault();
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', ()=>{ row.classList.remove('drag-over'); });
    row.addEventListener('drop', (e)=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      const dropIdx = parseInt(row.dataset.dragidx, 10);
      if(dragFromIdx === null || dragFromIdx === dropIdx) return;
      const moved = arr.splice(dragFromIdx, 1)[0];
      arr.splice(dropIdx, 0, moved);
      dragFromIdx = null;
      onReorder();
    });
  });
}

function buildContactLogRows(){
  const { fromDate, toDate, includeStatus, includeMessages, channel } = contactLogFilter;
  const fromD = fromDate ? new Date(fromDate) : null;
  const toD = toDate ? new Date(toDate + 'T23:59:59') : null;
  const inRange = (dateStr)=>{
    const d = new Date(dateStr);
    if(fromD && d < fromD) return false;
    if(toD && d > toD) return false;
    return true;
  };
  let rows = [];
  if(includeStatus){
    clients.forEach(c=>{
      (c.communications||[]).forEach(comm=>{
        if(!inRange(comm.date)) return;
        rows.push({
          date: comm.date,
          clientName: c.name,
          clientPhone: (c.countryCode||'')+' '+(c.phone||''),
          kind: 'حالة رد',
          detail: comm.status,
          byUser: comm.byUser || ''
        });
      });
    });
  }
  if(includeMessages){
    sentMessages.forEach(m=>{
      if(!inRange(m.date)) return;
      if(channel && m.channel !== channel) return;
      rows.push({
        date: m.date,
        clientName: m.clientName,
        clientPhone: m.clientPhone || '',
        kind: 'رسالة',
        detail: `${m.channel}${m.templateTitle ? ' — '+m.templateTitle : ''}`,
        byUser: m.byUser || ''
      });
    });
  }
  return rows.sort((a,b)=> new Date(b.date) - new Date(a.date));
}
function exportContactLogExcelFile(){

    "التاريخ": fmtDate(r.date),

function getVoiceTargets(){
  return [
    { label:"إضافة عميل", keywords:["اضافة عميل","إضافة عميل","عميل جديد","ضيف عميل","اضف عميل"], action:()=> openAddClientModal() },

    { label:"المشاركة والنسخ", keywords:["المشاركة","النسخ الاحتياطي","النسخ"], action:()=> setView('share') },
    { label:"الإعدادات", keywords:["الإعدادات","الاعدادات"], action:()=> setView('settings') },

  ];

function normalizeArabic(s){
  return String(s || '')
    .replace(/[\u064B-\u0652\u0670]/g, '') // strip Arabic diacritics
    .replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ')
    .trim();
}
function matchVoiceCommand(rawText){
  const t = normalizeArabic(rawText);
  if(!t) return { matches:[] };
  if(t.startsWith('ابحث عن') || t.startsWith('بحث عن')){
    const q = rawText.trim().replace(/^(ا)?بحث عن/, '').trim();
    return { searchQuery: q, matches:[] };
  }
  const targets = getVoiceTargets();
  const matches = targets.filter(target=>
    target.keywords.some(k=>{
      const nk = normalizeArabic(k);
      return t.includes(nk) || nk.includes(t);
    })
  );
  return { matches };
}
function startVoiceCommand(){
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor){
    alert('متصفحك لا يدعم الأوامر الصوتية. جرّب فتح النظام من متصفح Google Chrome.');
    return;
  }
  if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.protocol !== 'file:'){
    alert('الأوامر الصوتية تحتاج اتصالاً آمناً (https) أو تشغيل الملف محلياً.');
    return;
  }
  if(voiceListening) return;
  if(!voiceRecognition){
    voiceRecognition = new SpeechRecognitionCtor();
    voiceRecognition.lang = 'ar-SA';
    voiceRecognition.continuous = false;
    voiceRecognition.interimResults = false;
    voiceRecognition.onresult = (event)=>{
      const text = event.results[0][0].transcript || '';
      handleVoiceCommand(text);
    };
    voiceRecognition.onerror = (event)=>{
      voiceListening = false;
      render();
      const errorMessages = {
        'not-allowed': 'تم رفض إذن الميكروفون. يرجى السماح باستخدام الميكروفون من إعدادات المتصفح ثم المحاولة مجدداً.',
        'no-speech': 'لم يتم رصد أي صوت. تأكد أن الميكروفون يعمل وحاول التحدث بعد الضغط على الزر مباشرة.',
        'audio-capture': 'تعذّر الوصول إلى الميكروفون. تأكد أن جهازك متصل بميكروفون فعّال.',
        'network': 'تعذّر الاتصال بخدمة التعرف على الصوت. تحتاج هذه الميزة اتصالاً بالإنترنت.',
        'aborted': ''
      };
      const msg = errorMessages[event.error];
      if(msg) alert(msg);
      else if(event.error) alert('تعذّر تشغيل الأوامر الصوتية (' + event.error + '). لاحظ أنها قد لا تعمل إذا كان الملف مفتوحاً مباشرة من الجهاز (file://) بدل رابط ويب آمن (https).');
    };
    voiceRecognition.onend = ()=>{ voiceListening = false; render(); };
  }
  try{
    voiceListening = true;
    render();
    voiceRecognition.start();
  }catch(e){
    voiceListening = false;
    render();
  }
}
function handleVoiceCommand(rawText){
  const t = rawText.trim();
  if(!t) return;
  const result = matchVoiceCommand(t);
  if(result.searchQuery !== undefined){
    globalSearchQuery = result.searchQuery;
    globalSearchOpen = true;
    render();
    return;
  }
  if(result.matches.length === 1){
    result.matches[0].action();
  }else if(result.matches.length > 1){
    showVoiceOptions(t, result.matches);
  }else{
    showVoiceOptions(t, getVoiceTargets());
  }
}
function showVoiceOptions(heardText, matches){
  const modal = document.getElementById('voiceModal');
  modal.innerHTML = `
    <div class="modal-head">
      <div class="modal-head-row">
        <div><h2>لم أتأكد من الأمر المطلوب</h2><div class="sub">سمعت: "${esc(heardText)}" — اختر من القائمة أدناه</div></div>
        <button class="modal-close" id="closeVoiceModalBtn">✕</button>
      </div>
    </div>
    <div class="modal-body">
      ${matches.map((m, idx)=>`<button class="btn btn-ghost btn-sm" style="display:block; width:100%; margin-bottom:8px; text-align:right;" data-voiceoption="${idx}">${esc(m.label)}</button>`).join('')}
    </div>
  `;
  document.getElementById('closeVoiceModalBtn').onclick = closeVoiceModal;
  modal.querySelectorAll('[data-voiceoption]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.voiceoption, 10);
      closeVoiceModal();
      matches[idx].action();
    };
  });
  document.getElementById('voiceOverlay').classList.remove('hidden');
}

  const q = globalSearchQuery.trim();
  if(!q) return '';
  const matches = clients.filter(c=> c.name.includes(q) || (c.phone||'').includes(q)).slice(0,8);
  if(matches.length===0) return `<div class="global-search-dropdown"><div class="global-search-empty">لا توجد نتائج مطابقة</div></div>`;
  return `<div class="global-search-dropdown">${matches.map(c=>`
    <div class="global-search-item" data-globalsearchopen="${c.id}">
      <strong>${esc(c.name)}</strong>
      <span dir="ltr" style="color:var(--muted);">${esc(c.countryCode)} ${esc(c.phone)}</span>
    </div>
  `).join('')}</div>`;
}
function voiceSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function getUpcomingMeetings(){
  const now = new Date();
  const in24h = new Date(now.getTime() + 24*60*60*1000);
  return meetings.filter(m=>{
    if(!m.date) return false;
    const d = new Date(m.date);
    return d >= now && d <= in24h;
  }).sort((a,b)=> new Date(a.date) - new Date(b.date));
}
function getDueTasks(){
  const now = new Date();
  const in24h = new Date(now.getTime() + 24*60*60*1000);
  return tasks.filter(t=>{
    if(t.status === 'منجزة' || !t.dueDate) return false;
    const d = new Date(t.dueDate);
    return d <= in24h; // includes overdue (d < now) and due within next 24h
  }).sort((a,b)=> new Date(a.dueDate) - new Date(b.dueDate));
}
function renderNotificationsDropdown(){
  const upcoming = getUpcomingMeetings();
  const dueTasks = getDueTasks();
  if(upcoming.length===0 && dueTasks.length===0) return `<div class="global-search-dropdown"><div class="global-search-empty">لا توجد اجتماعات أو مهام مستحقة قريباً</div></div>`;
  const meetingItems = upcoming.map(m=>`
    <div class="global-search-item" data-openmeeting="${m.id}">
      <strong>📅 ${esc(m.name || m.type || 'اجتماع')}</strong>
      <span style="color:var(--muted); font-size:11px;">${fmtDate(m.date)}</span>
    </div>
  `).join('');
  const taskItems = dueTasks.map(t=>{
    const overdue = new Date(t.dueDate) < new Date();
    return `<div class="global-search-item" data-opentask="${t.id}">
      <strong>${overdue ? '⚠️' : '✅'} ${esc(t.title)}</strong>
      <span style="color:${overdue?'var(--danger)':'var(--muted)'}; font-size:11px;">${overdue?'متأخرة — ':''}${fmtDate(t.dueDate)}</span>
    </div>`;
  }).join('');
  return `<div class="global-search-dropdown">${meetingItems}${taskItems}</div>`;
}

function getFilteredListClients(){
  return clients.filter(c=>{
    const q = listFilters.q.trim();
    const matchesQ = !q || c.name.includes(q) || (c.companyName||'').includes(q) || (c.phone||'').includes(q) || (c.crNumber||'').includes(q);
    const matchesBrand = !listFilters.brand || c.brand === listFilters.brand;
    const l = latestComm(c);
    const matchesStatus = !listFilters.status || (l && l.status === listFilters.status) || (listFilters.status==='none' && !l);
    const r = latestRating(c);
    const matchesRating = !listFilters.rating || (r && r.category === listFilters.rating) || (listFilters.rating==='none' && !r);
    const matchesAssigned = !listFilters.assignedTo || c.assignedTo === listFilters.assignedTo || (listFilters.assignedTo==='none' && !c.assignedTo);
    return matchesQ && matchesBrand && matchesStatus && matchesRating && matchesAssigned;
  }).slice().reverse();

  const modal = document.getElementById('attachPreviewModal');
  const isImg = /^image\//.test(att.type||'');
  const isVideo = /^video\//.test(att.type||'');
  const isPdf = /pdf/.test(att.type||'');
  let contentHtml;
  if(isImg) contentHtml = `<img src="${att.dataUrl}" style="max-width:100%; max-height:65vh; border-radius:8px;">`;
  else if(isVideo) contentHtml = `<video src="${att.dataUrl}" controls style="max-width:100%; max-height:65vh; border-radius:8px;"></video>`;
  else if(isPdf) contentHtml = `<iframe src="${att.dataUrl}" style="width:100%; height:65vh; border:1px solid var(--border); border-radius:8px;"></iframe>`;
  else contentHtml = `<p style="color:var(--muted);">لا تتوفر معاينة لهذا النوع من الملفات.</p>`;

  modal.innerHTML = `
    <div class="modal-head">
      <div class="modal-head-row">
        <div><h2>${esc(att.name)}</h2></div>
        <button class="modal-close" id="closeAttachPreviewBtn">✕</button>
      </div>
    </div>
    <div class="modal-body" style="text-align:center;">
      ${contentHtml}
      <div class="btn-row" style="justify-content:center; margin-top:14px;">
        <a class="btn btn-primary btn-sm" href="${att.dataUrl}" download="${esc(att.name)}">تنزيل</a>
        ${!isVideo ? `<button class="btn btn-ghost btn-sm" id="printAttachmentBtn">طباعة</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('closeAttachPreviewBtn').onclick = ()=>{
    document.getElementById('attachPreviewOverlay').classList.add('hidden');
  };
  const printBtn = document.getElementById('printAttachmentBtn');
  if(printBtn){
    printBtn.onclick = ()=>{
      const w = window.open('', '_blank');
      if(!w){ alert('يرجى السماح بالنوافذ المنبثقة لهذا الموقع لتتمكن من الطباعة.'); return; }
      const body = isImg ? `<img src="${att.dataUrl}" style="max-width:100%;">` : `<iframe src="${att.dataUrl}" style="width:100%; height:100vh; border:none;"></iframe>`;
      w.document.write(`<html><head><title>${esc(att.name)}</title></head><body style="margin:0; text-align:center;">${body}</body></html>`);
      w.document.close();
      setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 600);
    };
  }
  document.getElementById('attachPreviewOverlay').classList.remove('hidden');
}
function meetingAttendeesHtml(attendees){
  return (attendees||[]).map((name, idx)=>`
    <span class="attendee-chip">${esc(name)} <button type="button" data-removeattendee="${idx}">×</button></span>
  `).join('') || `<p style="color:var(--muted); font-size:12px;">لا يوجد حضور مضاف بعد.</p>`;
}
let pendingMeetingPrefill = null;
function openMeetingModal(id, prefill){
  editingMeetingId = id || null;
  pendingMeetingPrefill = prefill || null;
  renderMeetingModal();
  document.getElementById('meetingOverlay').classList.remove('hidden');
}
function closeMeetingModal(){
  document.getElementById('meetingOverlay').classList.add('hidden');
  editingMeetingId = null;
  pendingMeetingPrefill = null;
}
function renderMeetingModal(){
  const modal = document.getElementById('meetingModal');
  const m = editingMeetingId ? meetings.find(x=>x.id===editingMeetingId) : null;
  const isNew = !m;
  const defaults = { type:MEETING_TYPES[0]||'', location:MEETING_LOCATIONS[0]||'', clientId:'', contactId:'', name:'', date:'', attendees:[], attachments:[], links:[], minutes:'' };
  const data = m || Object.assign({}, defaults, pendingMeetingPrefill || {});

  modal.innerHTML = `
    <div class="modal-head">
      <div class="modal-head-row">
        <div><h2>${isNew ? 'إضافة اجتماع جديد' : 'تفاصيل الاجتماع'}</h2><div class="sub">${isNew ? 'عبّئ بيانات الاجتماع' : 'يمكنك تعديل أي حقل ثم الحفظ'}</div></div>
        <button class="modal-close" id="closeMeetingModalBtn">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <form id="meetingForm">
        <div class="form-grid">
          <div class="field">
            <label>نوع الاجتماع</label>
            <div style="display:flex; gap:6px;">
              <select name="type" id="meetingTypeSelect" style="flex:1;">${MEETING_TYPES.map(t=>`<option value="${esc(t)}" ${data.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
              <button type="button" class="btn btn-ghost btn-sm" id="addMeetingTypeBtn" title="إضافة نوع جديد" style="padding:0 12px;">+</button>
            </div>
          </div>
          <div class="field">
            <label>الموقع / الفرع</label>
            <div style="display:flex; gap:6px;">
              <select name="location" id="meetingLocationSelect" style="flex:1;">${MEETING_LOCATIONS.map(l=>`<option value="${esc(l)}" ${data.location===l?'selected':''}>${esc(l)}</option>`).join('')}</select>
              <button type="button" class="btn btn-ghost btn-sm" id="addMeetingLocationBtn" title="إضافة موقع جديد" style="padding:0 12px;">+</button>
            </div>
          </div>
          <div class="field full">
            <label>ربط بعميل أو جهة اتصال (اختياري — يسمّي الاجتماع تلقائياً)</label>
            <select name="linkedRef" id="meetingClientSelect">
              <option value="">بدون ربط</option>
              <optgroup label="العملاء">
                ${clients.map(c=>`<option value="c_${c.id}" ${data.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
              </optgroup>
              <optgroup label="جهات الاتصال">
                ${contacts.map(k=>`<option value="k_${k.id}" ${data.contactId===k.id?'selected':''}>${esc(k.name)}</option>`).join('')}
              </optgroup>
            </select>
          </div>
          <div class="field full">
            <label>اسم الاجتماع</label>
            <input type="text" name="name" id="meetingNameInput" placeholder="مثال: متابعة فرنشايز مع العميل" value="${esc(data.name||'')}">
          </div>
          <div class="field full">
            <label>تاريخ ووقت الاجتماع</label>
            <input type="datetime-local" name="date" required value="${data.date ? new Date(data.date).toISOString().slice(0,16) : ''}">
          </div>
        </div>

        <div class="field full" style="margin-top:14px;">
          <label>الحضور</label>
          <div id="attendeesList">${meetingAttendeesHtml(data.attendees)}</div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <input type="text" id="newAttendeeInput" placeholder="اسم الحاضر" style="flex:1; padding:8px 10px; border-radius:6px; border:1.5px solid var(--border);">
            <button type="button" class="btn btn-ghost btn-sm" id="addAttendeeBtn">إضافة</button>
          </div>
        </div>

        <div class="field full" style="margin-top:14px;">
          <label>المرفقات (صور / فيديو / PDF)</label>
          <div id="attachmentsList">${(data.attachments||[]).map((a,i)=>meetingAttachmentPreviewHtml(a,i)).join('') || `<p style="color:var(--muted); font-size:12px;">لا توجد مرفقات بعد.</p>`}</div>
          <label class="btn btn-ghost btn-sm" style="cursor:pointer; margin-top:8px; display:inline-block;">
            إرفاق ملف
            <input type="file" id="meetingFileInput" accept="image/*,video/*,application/pdf" multiple style="display:none;">
          </label>
        </div>

        <div class="field full" style="margin-top:14px;">
          <label>روابط (مثال: رابط اجتماع أونلاين أو مرجع خارجي)</label>
          <div id="linksList">${meetingLinksHtml(data.links)}</div>
          <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
            <input type="text" id="newLinkLabel" placeholder="عنوان الرابط (اختياري)" style="flex:1; min-width:140px; padding:8px 10px; border-radius:6px; border:1.5px solid var(--border);">
            <input type="url" id="newLinkUrl" placeholder="https://..." dir="ltr" style="flex:1; min-width:160px; padding:8px 10px; border-radius:6px; border:1.5px solid var(--border);">
            <button type="button" class="btn btn-ghost btn-sm" id="addLinkBtn">إضافة</button>
          </div>
        </div>

        <div class="field full" style="margin-top:14px;">
          <label>محضر الاجتماع</label>
          <textarea name="minutes" rows="5" placeholder="اكتب محضر الاجتماع هنا...">${esc(data.minutes||'')}</textarea>

          <button type="submit" class="btn btn-primary">${isNew ? 'حفظ الاجتماع' : 'حفظ التعديلات'}</button>

        </div>
      </form>
    </div>
  `;

  // local working copies so edits before save don't mutate data prematurely
  let workingAttendees = (data.attendees||[]).slice();
  let workingAttachments = (data.attachments||[]).slice();
  let workingLinks = (data.links||[]).slice();

  document.getElementById('closeMeetingModalBtn').onclick = closeMeetingModal;
  document.getElementById('cancelMeetingBtn').onclick = closeMeetingModal;

  document.getElementById('meetingClientSelect').onchange = (e)=>{
    const val = e.target.value;
    if(val.startsWith('c_')){
      const c = clients.find(x=>x.id===val.slice(2));
      if(c) document.getElementById('meetingNameInput').value = c.name;
    }else if(val.startsWith('k_')){
      const k = contacts.find(x=>x.id===val.slice(2));
      if(k) document.getElementById('meetingNameInput').value = k.name;
    }
  };

  document.getElementById('addMeetingTypeBtn').onclick = ()=>{
    const val = prompt('أدخل نوع الاجتماع الجديد:');
    if(!val || !val.trim()) return;
    const v = val.trim();
    if(!MEETING_TYPES.includes(v)){ MEETING_TYPES.push(v); saveLists(); }
    const sel = document.getElementById('meetingTypeSelect');
    if(!Array.from(sel.options).some(o=>o.value===v)){
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    }
    sel.value = v;
  };
  document.getElementById('addMeetingLocationBtn').onclick = ()=>{
    const val = prompt('أدخل الموقع / الفرع الجديد:');
    if(!val || !val.trim()) return;
    const v = val.trim();
    if(!MEETING_LOCATIONS.includes(v)){ MEETING_LOCATIONS.push(v); saveLists(); }
    const sel = document.getElementById('meetingLocationSelect');
    if(!Array.from(sel.options).some(o=>o.value===v)){
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    }
    sel.value = v;
  };

  document.getElementById('addAttendeeBtn').onclick = ()=>{
    const input = document.getElementById('newAttendeeInput');
    const val = input.value.trim();
    if(!val) return;
    workingAttendees.push(val);
    document.getElementById('attendeesList').innerHTML = meetingAttendeesHtml(workingAttendees);
    input.value = '';

  function wireAttendeeRemovals(){
    document.querySelectorAll('[data-removeattendee]').forEach(btn=>{
      btn.onclick = ()=>{
        workingAttendees.splice(parseInt(btn.dataset.removeattendee,10), 1);
        document.getElementById('attendeesList').innerHTML = meetingAttendeesHtml(workingAttendees);
        wireAttendeeRemovals();
      };
    });
  }
  wireAttendeeRemovals();

  function refreshAttachmentsList(){
    document.getElementById('attachmentsList').innerHTML = workingAttachments.map((a,i)=>meetingAttachmentPreviewHtml(a,i)).join('') || `<p style="color:var(--muted); font-size:12px;">لا توجد مرفقات بعد.</p>`;

    wireAttachmentPreviews();
  }
  document.getElementById('meetingFileInput').onchange = (e)=>{
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    let remaining = files.length;
    files.forEach(file=>{
      readFileAsDataURL(file, (dataUrl)=>{
        workingAttachments.push({ name:file.name, type:file.type, dataUrl });
        remaining--;
        if(remaining === 0) refreshAttachmentsList();
      });
    });
  };
  function wireAttachmentRemovals(){
    document.querySelectorAll('[data-removeattachment]').forEach(btn=>{
      btn.onclick = ()=>{
        workingAttachments.splice(parseInt(btn.dataset.removeattachment,10), 1);

    document.querySelectorAll('[data-previewattachment]').forEach(btn=>{
      btn.onclick = ()=>{

        if(att) openAttachmentPreview(att);
      };

  wireAttachmentPreviews();

  document.getElementById('addLinkBtn').onclick = ()=>{

    labelInput.value = ''; urlInput.value = '';

  function wireLinkRemovals(){
    document.querySelectorAll('[data-removelink]').forEach(btn=>{
      btn.onclick = ()=>{

      };
    });

  wireLinkRemovals();

  const deleteBtn = document.getElementById('deleteMeetingBtn');
  if(deleteBtn){
    deleteBtn.onclick = ()=>{
      if(!confirm('هل تريد حذف هذا الاجتماع نهائياً؟')) return;
      meetings = meetings.filter(x=>x.id!==editingMeetingId);
      saveMeetings();
      closeMeetingModal();
      render();
    };
  }

  document.getElementById('meetingForm').onsubmit = (e)=>{
    e.preventDefault();
    const f = e.target;
    const linkedVal = f.linkedRef.value;
    const meetingData = {
      type: f.type.value,
      location: f.location.value,
      clientId: linkedVal.startsWith('c_') ? linkedVal.slice(2) : '',
      contactId: linkedVal.startsWith('k_') ? linkedVal.slice(2) : '',
      name: f.name.value.trim(),
      date: f.date.value ? new Date(f.date.value).toISOString() : '',
      attendees: workingAttendees,
      attachments: workingAttachments,
      links: workingLinks,
      minutes: f.minutes.value.trim()
    };
    if(!meetingData.date){ alert('يرجى تحديد تاريخ ووقت الاجتماع'); return; }
    if(isNew){
      meetings.push({
        id: 'mt'+Date.now(),
        ...meetingData,
        createdBy: currentUserName() || '',
        createdAt: new Date().toISOString()
      });
    }else{
      Object.assign(m, meetingData);
    }
    saveMeetings();
    closeMeetingModal();
    render();
  };
}

/* ============== Meetings Report (تقرير الاجتماعات) ============== */
function resolveMeetingLinkedName(m){
  if(m.clientId){ const c = clients.find(x=>x.id===m.clientId); return c ? c.name : null; }
  if(m.contactId){ const k = contacts.find(x=>x.id===m.contactId); return k ? k.name : null; }
  return null;
}
function getFilteredMeetings(){
  const { fromDate, toDate, type, location } = meetingsFilter;
  return meetings.filter(m=>{
    if(!m.date) return false;
    const d = new Date(m.date);
    if(fromDate && d < new Date(fromDate)) return false;
    if(toDate && d > new Date(toDate + 'T23:59:59')) return false;
    if(type && m.type !== type) return false;
    if(location && m.location !== location) return false;
    return true;
  }).sort((a,b)=> new Date(a.date) - new Date(b.date));
}
function renderMeetingsReportView(){
  const { fromDate, toDate, type, location } = meetingsFilter;
  const filtered = getFilteredMeetings();

  const rows = filtered.map(m=>{
    const linkedName = resolveMeetingLinkedName(m);
    return `<tr data-openmeeting="${m.id}">
      <td>${fmtDate(m.date)}</td>
      <td>${esc(m.name || linkedName || m.type || '—')}</td>
      <td>${esc(m.type||'—')}</td>
      <td>${esc(m.location||'—')}</td>
      <td>${linkedName ? esc(linkedName) : '—'}</td>
      <td>${(m.attendees||[]).length}</td>
      <td>${esc(m.createdBy||'—')}</td>
    </tr>`;
  }).join('');

  return `
    <div class="topbar">
      <div><h1>تقرير الاجتماعات</h1><p>كل الاجتماعات التي أُقيمت خلال فترة محددة، مع إمكانية التصفية حسب النوع والموقع</p></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="exportMeetingsExcelBtn">تصدير Excel</button>
        <button class="btn btn-ghost" id="printMeetingsReportBtn">طباعة / PDF</button>
        <button class="btn btn-wa" id="shareMeetingsReportExcelBtn">مشاركة</button>
      </div>
    </div>
    <div class="filters">
      <div class="field" style="min-width:150px;"><label style="font-size:11px;">من تاريخ</label><input type="date" id="meetingsFromDate" value="${esc(fromDate)}"></div>
      <div class="field" style="min-width:150px;"><label style="font-size:11px;">إلى تاريخ</label><input type="date" id="meetingsToDate" value="${esc(toDate)}"></div>
      <select id="meetingsTypeFilter">
        <option value="">كل أنواع الاجتماعات</option>
        ${MEETING_TYPES.map(t=>`<option value="${esc(t)}" ${type===t?'selected':''}>${esc(t)}</option>`).join('')}
      </select>
      <select id="meetingsLocationFilter">
        <option value="">كل المواقع/الفروع</option>
        ${MEETING_LOCATIONS.map(l=>`<option value="${esc(l)}" ${location===l?'selected':''}>${esc(l)}</option>`).join('')}
      </select>
      <button class="btn btn-primary btn-sm" id="meetingsReportSearchBtn" style="align-self:flex-end;">بحث</button>
    </div>
    <div class="stats-row" style="margin-bottom:16px;">
      <div class="stat-card"><div class="stat-num">${filtered.length}</div><div class="stat-label">عدد الاجتماعات المطابقة</div></div>
    </div>
    <div class="table-wrap">
      ${filtered.length===0 ? `<div class="empty">لا توجد اجتماعات مطابقة لهذا الفلتر.</div>` : `
      <table>
        <thead><tr><th>التاريخ</th><th>اسم الاجتماع</th><th>النوع</th><th>الموقع</th><th>العميل</th><th>الحضور</th><th>أنشأه</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`}
    </div>
  `;
}
function meetingsReportToRows(){
  return getFilteredMeetings().map(m=>{
    const linkedName = resolveMeetingLinkedName(m);
    return {
      "التاريخ": fmtDate(m.date),
      "اسم الاجتماع": m.name || linkedName || m.type || '',
      "النوع": m.type || '',
      "الموقع": m.location || '',
      "العميل / جهة الاتصال": linkedName || '',
      "عدد الحضور": (m.attendees||[]).length,
      "الحضور": (m.attendees||[]).join('، '),
      "عدد المرفقات": (m.attachments||[]).length,
      "محضر الاجتماع": m.minutes || '',
      "أنشأه": m.createdBy || ''
    };
  });
}
function exportMeetingsExcel(){
  const rows = meetingsReportToRows();
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الاجتماعات");
  XLSX.writeFile(wb, `تقرير-الاجتماعات-${new Date().toISOString().slice(0,10)}.xlsx`);
}
async function shareMeetingsReportExcel(){
  const rows = meetingsReportToRows();
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الاجتماعات");
  await shareWorkbookOrDownload(wb, `تقرير-الاجتماعات-${new Date().toISOString().slice(0,10)}.xlsx`, 'تقرير الاجتماعات');
}
function printMeetingsReportPage(){
  const rows = meetingsReportToRows();
  const headers = ["التاريخ","اسم الاجتماع","النوع","الموقع","العميل / جهة الاتصال","عدد الحضور","عدد المرفقات","أنشأه"];
  const tableRows = rows.map(r=>headers.map(h=>r[h]));
  printHtmlContent('تقرير الاجتماعات', tableToHtml(headers, tableRows));
}

/* ============== المهام (Tasks) ============== */
function isTaskOverdue(t){
  return t.status !== 'منجزة' && t.dueDate && new Date(t.dueDate) < new Date();
}
function taskStatusBadge(t){
  if(t.status === 'منجزة') return `<span class="badge b-done">منجزة</span>`;
  if(isTaskOverdue(t)) return `<span class="badge b-nope">متأخرة</span>`;
  return `<span class="badge b-pending">قيد التنفيذ</span>`;
}
function taskRowTint(t){
  if(t.status === 'منجزة') return 'row-tint-done';
  if(isTaskOverdue(t)) return 'row-tint-nope';
  return '';
}
function getFilteredTasksForList(){
  return tasks.filter(t=>{
    const matchesStatus = !tasksFilter.status || (tasksFilter.status==='متأخرة' ? isTaskOverdue(t) : t.status===tasksFilter.status);
    const matchesAssigned = !tasksFilter.assignedTo || t.assignedTo === tasksFilter.assignedTo;
    return matchesStatus && matchesAssigned;
  }).sort((a,b)=> new Date(a.dueDate||0) - new Date(b.dueDate||0));
}
function tasksToExcelRows(list){
  return list.map(t=>{
    const linkedClientNames = (t.clientIds||[]).map(id=>{ const c = clients.find(x=>x.id===id); return c?c.name:null; }).filter(Boolean).join('، ');
    const au = users.find(u=>u.id===t.assignedTo);
    return {
      "العنوان": t.title, "العميل": linkedClientNames, "الموظف المسؤول": au?au.name:'',
      "تاريخ الاستحقاق": t.dueDate?fmtDate(t.dueDate):'', "الحالة": t.status==='منجزة'?'منجزة':(isTaskOverdue(t)?'متأخرة':'قيد التنفيذ')
    };
  });
}
function exportTasksListExcel(){
  const rows = tasksToExcelRows(getFilteredTasksForList());
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "المهام");
  XLSX.writeFile(wb, `المهام-${new Date().toISOString().slice(0,10)}.xlsx`);

function getFilteredTasksForReport(){
  const { fromDate, toDate, assignedTo, status } = tasksReportFilter;
  return tasks.filter(t=>{
    if(!t.dueDate) return false;
    const d = new Date(t.dueDate);
    if(fromDate && d < new Date(fromDate)) return false;
    if(toDate && d > new Date(toDate + 'T23:59:59')) return false;
    if(assignedTo && t.assignedTo !== assignedTo) return false;
    if(status && (status==='متأخرة' ? !isTaskOverdue(t) : t.status !== status)) return false;
    return true;
  }).sort((a,b)=> new Date(a.dueDate) - new Date(b.dueDate));
}

/* ============== Communications View ============== */
function getFilteredCommsClients(){
  return clients.filter(c=>{
    const q = commFilters.q.trim();
    const matchesQ = !q || c.name.includes(q) || (c.phone||'').includes(q) || (c.activity||'').includes(q);
    const l = latestComm(c);
    const matchesStatus = !commFilters.status || (l && l.status === commFilters.status) || (commFilters.status==='none' && !l);
    const r = latestRating(c);
    const matchesRating = !commFilters.rating || (r && r.category === commFilters.rating) || (commFilters.rating==='none' && !r);
    return matchesQ && matchesStatus && matchesRating;
  }).slice().reverse();
}
function commsToRows(){
  return getFilteredCommsClients().map(c=>{
    const l = latestComm(c);
    const r = latestRating(c);
    return {
      "رقم الملف": c.id,
      "الاسم": c.name,
      "رقم الجوال": c.countryCode + " " + c.phone,
      "النشاط": c.activity || "",
      "التقييم": r ? r.category : "",
      "حالة التواصل": l ? l.status : "",
      "آخر تحديث": l ? fmtDate(l.date) : ""
    };
  });
}
function exportCommsExcel(){
  const rows = commsToRows();
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "حالة الردود");
  XLSX.writeFile(wb, `حالة-الردود-${new Date().toISOString().slice(0,10)}.xlsx`);
}
async function shareCommsExcel(){
  const rows = commsToRows();
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "حالة الردود");
  await shareWorkbookOrDownload(wb, `حالة-الردود-${new Date().toISOString().slice(0,10)}.xlsx`, 'حالة الردود');
}
function printCommsReport(){

  printHtmlContent('حالة الردود', tableToHtml(headers, tableRows));

/* ============== Report View ============== */
function renderReportView(){
  const byBrand = {}; BRANDS.forEach(b=> byBrand[b] = clients.filter(c=>c.brand===b).length);
  const byStatus = {}; COMM_STATUSES.forEach(s=> byStatus[s]=0);
  let noStatus = 0;
  clients.forEach(c=>{ const l=latestComm(c); if(l) byStatus[l.status]++; else noStatus++; });
  const byRating = {}; RATING_OPTIONS.forEach(r=> byRating[r]=0);
  let noRating = 0;
  clients.forEach(c=>{ const r=latestRating(c); if(r) byRating[r.category]++; else noRating++; });

  const allNotes = [];
  clients.forEach(c=>{ (c.communications||[]).forEach(m=> allNotes.push({...m, clientName:c.name, clientId:c.id})); });
  allNotes.sort((a,b)=> new Date(b.date) - new Date(a.date));

  const maxBrand = Math.max(1, ...Object.values(byBrand));
  const maxStatus = Math.max(1, ...Object.values(byStatus), noStatus);
  const maxRating = Math.max(1, ...Object.values(byRating), noRating);

  const notesRows = allNotes.slice(0,50).map(n=>`
    <tr>
      <td><span class="file-id">${n.clientId}</span></td>
      <td>${esc(n.clientName)}</td>
      <td><span class="badge ${commBadgeClass(n.status)}">${esc(n.status)}</span></td>
      <td style="color:var(--muted); font-size:12px;">${fmtDate(n.date)}</td>
      <td>${esc(n.note || '—')}</td>
    </tr>`).join('');

  return `
    <div class="topbar">
      <div><h1>التقارير</h1><p>ملخص حالة العملاء وسجل ملاحظات التواصل</p></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="exportReportExcelBtn">تصدير تقرير Excel</button>
        <button class="btn btn-ghost" onclick="window.print()">طباعة التقرير</button>
      </div>
    </div>

    <div class="report-grid">
      <div class="report-card"><h3>العملاء حسب العلامة التجارية</h3>
        ${BRANDS.map(b=>`<div class="bar-row"><span class="lbl">${b}</span><span class="bar-track"><span class="bar-fill" style="width:${(byBrand[b]/maxBrand)*100}%"></span></span><span class="bar-count">${byBrand[b]}</span></div>`).join('')}
      </div>
      <div class="report-card"><h3>آخر حالة تواصل</h3>

/* ============== Users View ============== */
let editingPermissionsUserId = null;

  const amSuperAdmin = isSuperAdmin();

    const isCurrent = u.id === currentUserId;
    const avatarHtml = u.avatar ? `<img src="${u.avatar}" class="avatar">` : `<span class="avatar-placeholder">${esc(u.name.trim()[0]||'?')}</span>`;
    if(editingUserId === u.id){
      return `<div class="user-card ${isCurrent?'current':''}">
        <div class="uname">${avatarHtml} ${esc(u.name)}</div>
        <form class="user-edit-form" data-edituserform="${u.id}">
          <input type="text" name="name" value="${esc(u.name)}" placeholder="الاسم الكامل" required>
          <input type="text" name="username" value="${esc(u.username)}" placeholder="اسم المستخدم" required>
          <input type="text" name="password" value="${esc(u.password)}" placeholder="كلمة المرور" required>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary btn-sm">حفظ</button>
            <button type="button" class="btn btn-ghost btn-sm" data-canceledit="${u.id}">إلغاء</button>
          </div>
        </form>

      const checks = ALL_NAV_VIEWS.filter(v=>v.id!=='settings').map(v=>`
        <label style="display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:6px;">
          <input type="checkbox" class="perm-checkbox" data-permview="${v.id}" ${(u.permissions||[]).includes(v.id)?'checked':''}> ${esc(v.label)}

      `).join('');
      return `<div class="user-card ${isCurrent?'current':''}">
        <div class="uname">${avatarHtml} ${esc(u.name)} <span class="badge b-none">صلاحيات الوصول</span></div>
        <div style="margin-top:10px; max-height:220px; overflow-y:auto;">${checks}</div>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-primary btn-sm" data-savepermissions="${u.id}">حفظ الصلاحيات</button>
          <button class="btn btn-ghost btn-sm" data-cancelpermissions="1">إلغاء</button>
        </div>
      </div>`;
    }
    return `<div class="user-card ${isCurrent?'current':''}">
      <div class="uname">${avatarHtml} ${esc(u.name)} ${u.role==='super_admin' ? '<span class="badge b-done">سوبر أدمن</span>' : ''}</div>
      <div class="umeta">اسم الدخول: ${esc(u.username)} · أُضيف ${fmtDate(u.createdAt)} · ${count} عميل مسجّل</div>
      <div class="btn-row">
        ${isCurrent ? `<span class="badge b-done">أنت الآن</span>` : ''}

        <label class="btn btn-ghost btn-sm" style="cursor:pointer;">تغيير الصورة<input type="file" accept="image/*" data-avatar-for="${u.id}" style="display:none;"></label>
        ${(amSuperAdmin && u.role!=='super_admin') ? `<button class="btn btn-ghost btn-sm" data-editpermissions="${u.id}">الصلاحيات</button>` : ''}
        ${users.length>1 ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger);" data-deleteuser="${u.id}">حذف</button>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="topbar"><div><h1>المستخدمون</h1><p>حسابات الدخول إلى النظام — كل حساب له اسم مستخدم وكلمة مرور خاصة به، ويُسجَّل تلقائياً كمن أضاف كل عميل${amSuperAdmin ? '. بصفتك سوبر أدمن، يمكنك تحديد صفحات النظام التي يصل إليها كل مستخدم.' : ''}</p></div></div>

    ${users.length===0 ? `<div class="table-wrap"><div class="empty">لا يوجد مستخدمون بعد.</div></div>` : `<div class="user-cards">${cards}</div>`}
  `;
}

/* ============== Settings View ============== */
const LIST_META = {
  entityTypes: { label:"أنواع الجهة", type:"simple" },
  ratingOptions: { label:"خيارات التقييم", type:"simple" },
  heardAboutOptions: { label:"كيف سمعت عن علامتنا التجارية", type:"simple" },

  fundingOptions: { label:"نوع التمويل", type:"simple" },
  targetRegions: { label:"المناطق المستهدفة", type:"simple" },
  meetingTypes: { label:"أنواع الاجتماعات", type:"simple" },
  meetingLocations: { label:"مواقع/فروع الاجتماعات", type:"simple" },
  countries: { label:"الدول ومفاتيح الاتصال", type:"country" }
};
function getListArray(key){
  return { entityTypes:ENTITY_TYPES, ratingOptions:RATING_OPTIONS, heardAboutOptions:HEARD_ABOUT_OPTIONS, capitalOptions:CAPITAL_OPTIONS, fundingOptions:FUNDING_OPTIONS, targetRegions:TARGET_REGIONS, meetingTypes:MEETING_TYPES, meetingLocations:MEETING_LOCATIONS, countries:COUNTRIES }[key];
}
function renderSettingsView(){
  const listsHtml = Object.entries(LIST_META).map(([key, meta])=>{
    const arr = getListArray(key);
    const chips = arr.map((item, idx)=>{
      const label = meta.type==='country' ? `${item.name} (${item.code})` : item;
      return `<span class="list-chip">${esc(label)} <button data-removelist="${key}|${idx}" title="حذف">×</button></span>`;
    }).join('');

      ? `<div class="list-add-row">
          <input type="text" placeholder="اسم الدولة" data-newcountryname="${key}">

          <button class="btn btn-ghost btn-sm" data-additem="${key}">إضافة</button>

    return `<div class="share-card"><h3>${meta.label}</h3><div class="list-chips">${chips}</div>${addRow}</div>`;
  }).join('');

  return `
    <div class="topbar"><div><h1>الإعدادات</h1><p>شعار النظام، وإدارة القوائم الأساسية والفرعية المستخدمة في كل شاشات النظام</p></div></div>

    <div class="share-card">
      <h3>شعار النظام</h3>
      <p>ارفع صورة شعار شركتك ليظهر في الشريط الجانبي وفي شاشة تسجيل الدخول.</p>
      <div class="file-upload-row">
        ${systemLogo ? `<img src="${systemLogo}" style="max-height:48px; max-width:160px; object-fit:contain;">` : `<span style="color:var(--muted); font-size:12.5px;">لا يوجد شعار حالياً</span>`}
        <label class="btn btn-primary btn-sm" style="cursor:pointer;">رفع شعار<input type="file" id="logoUpload" accept="image/*" style="display:none;"></label>
        ${systemLogo ? `<button class="btn btn-ghost btn-sm" id="removeLogoBtn">إزالة الشعار</button>` : ''}
      </div>
    </div>

    <div class="share-card">
      <h3>قوالب رسائل الدردشة (واتساب)</h3>
      <p>تُدار قوالب الرسائل الآن من صفحة "محتوى الرسائل" الموجودة ضمن قائمة "التواصل مع العملاء" في الشريط الجانبي.</p>
      <button class="btn btn-ghost btn-sm" data-goto="messages">فتح محتوى الرسائل</button>
    </div>

    <div class="share-card">
      <h3>العلامات التجارية</h3>
      <p>تُدار العلامات التجارية (البراندات) الآن من صفحتها المستقلة في الشريط الجانبي.</p>
      <button class="btn btn-ghost btn-sm" data-goto="brands">فتح العلامات التجارية</button>
    </div>

    <div class="share-card">
      <h3>استجابة العملاء (حالات التواصل)</h3>
      <p>تُدار حالات الرد الآن من صفحة "استجابة العملاء" الموجودة ضمن قائمة "التواصل مع العملاء" في الشريط الجانبي.</p>
      <button class="btn btn-ghost btn-sm" data-goto="responsecategories">فتح استجابة العملاء</button>
    </div>

    <div class="share-card">
      <h3>تخصيص أسماء قوائم النظام</h3>
      <p style="color:var(--muted); font-size:12px; margin-bottom:14px;">غيّر مسمى أي صفحة رئيسية أو فرعية في الشريط الجانبي حسب ما يناسب فريقك. اترك الخانة فارغة للرجوع للاسم الافتراضي. ملاحظة: بعض العناصر (مثل "التواصل مع العملاء" و"حالة الردود") تفتح نفس الصفحة، لذا تغيير أحدهما قد يغيّر الآخر أيضاً.</p>
      <div style="display:flex; flex-direction:column; gap:8px; max-width:480px;">
        ${ALL_NAV_VIEWS.map(v=>`
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="min-width:150px; font-size:12px; color:var(--muted);">${esc(v.label)}</span>
            <input type="text" class="nav-label-input" data-navlabelkey="${v.id}" placeholder="${esc(v.label)}" value="${esc(navLabelOverrides[v.id]||'')}" style="flex:1; padding:7px 10px; border-radius:6px; border:1.5px solid var(--border); font-size:12px;">

      <button class="btn btn-primary btn-sm" id="saveNavLabelsBtn" style="margin-top:12px;">حفظ المسمّيات</button>

    <h2 style="font-size:16px; margin-bottom:4px;">إدارة القوائم</h2>
    <p style="color:var(--muted); font-size:12.5px; margin-bottom:14px;">أضف أو احذف أي عنصر من هذه القوائم — التغييرات تنعكس فوراً في نموذج إضافة العميل، الفلاتر، والتقارير. حسابات المستخدمين (اسم الدخول وكلمة المرور) تُدار من صفحة "المستخدمون".</p>
    ${listsHtml}
  `;
}

    <div class="add-log-box">

    };
  }
  const cancelEditClient = modal.querySelector('#cancelEditClient');
  if(cancelEditClient) cancelEditClient.onclick = ()=>{ clientEditMode = false; renderModal(); };
  const editFranchiseGroup = modal.querySelector('#editFranchiseGroup');

        }

    });

  const editClientForm = modal.querySelector('#editClientForm');

    editClientForm.onsubmit = (e)=>{

      c.companyName = f.companyName.value.trim();

      c.countryCode = f.countryCode.value;

      c.brand = f.brand.value;
      c.assignedTo = f.assignedTo.value || '';
      c.notes = f.notes.value.trim();

      renderModal();
    };
  }
  const deleteClientBtn = modal.querySelector('#deleteClientBtn');
  if(deleteClientBtn){
    deleteClientBtn.onclick = ()=>{

      closeModal();

    };

  const ratingChoice = modal.querySelector('#ratingChoice');

      renderModal();
    };

}

/* ============== Export / Import ============== */
function exportData(){
  const lists = { brands:BRANDS, countries:COUNTRIES, entityTypes:ENTITY_TYPES, commStatuses:COMM_STATUSES, ratingOptions:RATING_OPTIONS, messageTemplates:MESSAGE_TEMPLATES, heardAboutOptions:HEARD_ABOUT_OPTIONS, capitalOptions:CAPITAL_OPTIONS, fundingOptions:FUNDING_OPTIONS };
  const payload = { clients, users, lists, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `نسخة-عملاء-الفرنشايز-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data.clients) || !Array.isArray(data.users)) throw new Error('bad format');
      if(!confirm('سيتم استبدال جميع البيانات الحالية بالبيانات المستوردة، وسيُطلب تسجيل الدخول من جديد. هل تريد المتابعة؟')) return;
      clients = data.clients; users = data.users;
      if(data.lists){
        BRANDS = data.lists.brands || BRANDS;
        COUNTRIES = data.lists.countries || COUNTRIES;
        ENTITY_TYPES = data.lists.entityTypes || ENTITY_TYPES;
        COMM_STATUSES = data.lists.commStatuses || COMM_STATUSES;
        RATING_OPTIONS = data.lists.ratingOptions || RATING_OPTIONS;
        saveLists();
      }
      saveClients(); saveUsers();
      alert('تم استيراد البيانات بنجاح. يرجى تسجيل الدخول من جديد.');
      localStorage.removeItem('fcrm_logged_in_user');
      showLogin();
    }catch(err){ alert('تعذّر قراءة الملف. تأكد أنه ملف نسخة صحيح تم تنزيله من هذا النظام.'); }
  };
  reader.readAsText(file, 'utf-8');
}
