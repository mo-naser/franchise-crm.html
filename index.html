const EXCEL_HEADERS = ["رقم الملف","اسم العميل","نوع الجهة","اسم الشركة","رقم السجل التجاري","النشاط الحالي","الدولة","رقم الجوال","البريد الإلكتروني","المنطقة المستهدفة","كيف سمع عن العلامة","رأس المال المتاح","نوع التمويل","سبق الفرنشايز","العلامة التي حصل عليها سابقاً","البراند المطلوب","التقييم","حالة التواصل","الموظف المسؤول","ملاحظات","أضيف بواسطة","تاريخ الإضافة"];

function clientToExcelRow(c){
  return {
    "رقم الملف": c.id,
    "اسم العميل": c.name,
    "نوع الجهة": c.entityType,
    "اسم الشركة": c.companyName || "",
    "رقم السجل التجاري": c.crNumber || "",
    "النشاط الحالي": c.activity || "",
    "الدولة": countryNameFromCode(c.countryCode),
    "رقم الجوال": c.countryCode + " " + c.phone,
    "البريد الإلكتروني": c.email || "",
    "المنطقة المستهدفة": c.targetRegion || "",
    "كيف سمع عن العلامة": c.heardAbout || "",
    "رأس المال المتاح": c.capital || "",
    "نوع التمويل": c.funding || "",
    "سبق الفرنشايز": c.triedFranchise ? "نعم" : "لا",
    "العلامة التي حصل عليها سابقاً": c.prevFranchiseBrand || "",
    "البراند المطلوب": c.brand,
    "التقييم": (latestRating(c) ? latestRating(c).category : ""),
    "حالة التواصل": (latestComm(c) ? latestComm(c).status : ""),
    "الموظف المسؤول": (()=>{ const au = users.find(x=>x.id===c.assignedTo); return au ? au.name : ""; })(),
    "ملاحظات": c.notes || "",
    "أضيف بواسطة": c.addedBy || "",
    "تاريخ الإضافة": fmtDate(c.createdAt)
  };
}
function exportClientsExcel(list){
  const rows = (list || clients).map(clientToExcelRow);
  const ws = XLSX.utils.json_to_sheet(rows, {header: EXCEL_HEADERS});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "العملاء");
  XLSX.writeFile(wb, `عملاء-الفرنشايز-${new Date().toISOString().slice(0,10)}.xlsx`);
}
async function shareClientsExcel(list){
  const rows = (list || clients).map(clientToExcelRow);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "العملاء");

function printClientsReport(list){

function downloadExcelTemplate(){

function importClientsFromExcel(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!rows.length){ alert('الملف لا يحتوي على بيانات.'); return; }
      let added = 0;
      rows.forEach(row=>{
        const name = String(row["اسم العميل"] || row["الاسم"] || '').trim();
        if(!name) return;
        const countryName = String(row["الدولة"] || '').trim();
        let countryMatch = COUNTRIES.find(cc=>cc.name===countryName);
        let phoneRaw = String(row["رقم الجوال"] || '').trim();
        let countryCode = countryMatch ? countryMatch.code : '';
        if(!countryCode){
          const found = COUNTRIES.find(cc=>phoneRaw.replace(/\s/g,'').startsWith(cc.code));
          if(found){ countryCode = found.code; phoneRaw = phoneRaw.replace(/\s/g,'').slice(found.code.length); }
        } else if(phoneRaw.replace(/\s/g,'').startsWith(countryCode)){
          phoneRaw = phoneRaw.replace(/\s/g,'').slice(countryCode.length);
        }
        const triedFranchise = String(row["سبق الفرنشايز"] || '').trim() === 'نعم';
        let brand = String(row["البراند المطلوب"] || '').trim();
        if(!BRANDS.includes(brand)) brand = BRANDS[0];
        const ratingCat = String(row["التقييم"] || '').trim();
        const commStatus = String(row["حالة التواصل"] || row["الرد"] || '').trim();
        const newClient = {
          id: nextFileId(),
          name,
          entityType: ENTITY_TYPES.includes(row["نوع الجهة"]) ? row["نوع الجهة"] : "فرد",
          companyName: String(row["اسم الشركة"] || '').trim(),
          crNumber: String(row["رقم السجل التجاري"] || '').trim(),
          activity: String(row["النشاط الحالي"] || '').trim(),
          countryCode: countryCode || COUNTRIES[0].code,
          phone: phoneRaw,
          email: String(row["البريد الإلكتروني"] || '').trim(),
          triedFranchise,
          prevFranchiseBrand: String(row["العلامة التي حصل عليها سابقاً"] || row["العلامة التي حصل عليها في الفرنشايز"] || '').trim(),
          brand,
          notes: String(row["ملاحظات"] || '').trim(),
          addedBy: currentUserName() || 'استيراد Excel',
          createdAt: new Date().toISOString(),
          ratings: RATING_OPTIONS.includes(ratingCat) ? [{date:new Date().toISOString(), category:ratingCat, note:'مستورد من إكسل'}] : [],
          communications: COMM_STATUSES.includes(commStatus) ? [{date:new Date().toISOString(), status:commStatus, note:'مستورد من إكسل'}] : []
        };
        clients.push(newClient);
        added++;
      });
      saveClients();
      alert(`تم استيراد ${added} عميل بنجاح.`);
      setView('clients');
    }catch(err){
      alert('تعذّر قراءة ملف الإكسل. تأكد من صيغة الملف وأسماء الأعمدة (استخدم النموذج الفارغ كمرجع).');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ============== View-specific handlers ============== */
function attachViewHandlers(){
  // global search (appears on every page via userStripHtml)
  const globalSearchInput = document.getElementById('globalSearchInput');
  if(globalSearchInput){
    globalSearchInput.oninput = (e)=>{
      globalSearchQuery = e.target.value;
      globalSearchOpen = true;
      render();
      const el = document.getElementById('globalSearchInput');
      if(el){ el.focus(); el.setSelectionRange(globalSearchQuery.length, globalSearchQuery.length); }
    };
    globalSearchInput.onfocus = ()=>{ if(globalSearchQuery.trim()){ globalSearchOpen = true; render(); } };
  }
  document.querySelectorAll('[data-globalsearchopen]').forEach(item=>{
    item.onclick = ()=>{
      const id = item.dataset.globalsearchopen;
      globalSearchOpen = false;
      globalSearchQuery = '';
      openModal(id, 'info');
    };
  });
  const voiceCmdBtn = document.getElementById('voiceCmdBtn');
  if(voiceCmdBtn) voiceCmdBtn.onclick = startVoiceCommand;
  const notifBellBtn = document.getElementById('notifBellBtn');
  if(notifBellBtn) notifBellBtn.onclick = ()=>{ notifOpen = !notifOpen; render(); };
  document.querySelectorAll('[data-openmeeting]').forEach(el=>{
    el.onclick = ()=>{ notifOpen = false; openMeetingModal(el.dataset.openmeeting); };
  });
  document.querySelectorAll('[data-opentask]').forEach(el=>{
    el.onclick = ()=>{ openTaskModal(el.dataset.opentask); };
  });
  document.querySelectorAll('[data-completetask]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const t = tasks.find(x=>x.id===btn.dataset.completetask);
      if(t){ t.status = 'منجزة'; saveTasks(); render(); }
    };
  });
  document.querySelectorAll('[data-opencontact]').forEach(el=>{
    el.onclick = ()=>{ openContactModal(el.dataset.opencontact); };
  });
  document.querySelectorAll('[data-wacontact]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const k = contacts.find(x=>x.id===btn.dataset.wacontact);
      if(k){
        const defaultTpl = MESSAGE_TEMPLATES[0];

  }
  else if(currentView === 'contactlog'){
    document.getElementById('clFromDate').onchange = (e)=>{ contactLogFilter.fromDate = e.target.value; render(); };
    document.getElementById('clToDate').onchange = (e)=>{ contactLogFilter.toDate = e.target.value; render(); };
    document.getElementById('clSearchBtn').onclick = ()=>{
      contactLogFilter.fromDate = document.getElementById('clFromDate').value;
      contactLogFilter.toDate = document.getElementById('clToDate').value;
      render();
    };
    document.getElementById('clIncludeStatus').onchange = (e)=>{ contactLogFilter.includeStatus = e.target.checked; render(); };
    document.getElementById('clIncludeMessages').onchange = (e)=>{ contactLogFilter.includeMessages = e.target.checked; render(); };
    document.getElementById('clChannelFilter').onchange = (e)=>{ contactLogFilter.channel = e.target.value; render(); };
    document.getElementById('exportContactLogBtn').onclick = exportContactLogExcel;
    document.getElementById('shareContactLogBtn').onclick = shareContactLogExcel;
    document.getElementById('shareContactLogTextBtn').onclick = shareContactLogText;
    document.getElementById('printContactLogBtn').onclick = printContactLogReport;
  }
  else if(currentView === 'settings'){
    document.getElementById('logoUpload').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      readFileAsDataURL(file, (dataUrl)=>{ systemLogo = dataUrl; saveLogo(); applyLogoDisplays(); render(); });
    };
    const removeLogoBtn = document.getElementById('removeLogoBtn');
    if(removeLogoBtn) removeLogoBtn.onclick = ()=>{ systemLogo = null; saveLogo(); applyLogoDisplays(); render(); };

    document.getElementById('saveNavLabelsBtn').onclick = ()=>{
      document.querySelectorAll('.nav-label-input').forEach(input=>{
        const key = input.dataset.navlabelkey;
        const val = input.value.trim();
        if(val) navLabelOverrides[key] = val;
        else delete navLabelOverrides[key];
      });
      saveNavLabelOverrides();
      alert('تم حفظ مسمّيات القوائم. سيتم إعادة تحميل الصفحة لتطبيقها.');
      location.reload();
    };

    document.querySelectorAll('[data-removelist]').forEach(btn=>{
      btn.onclick = ()=>{
        const [key, idxStr] = btn.dataset.removelist.split('|');
        const idx = parseInt(idxStr, 10);
        const arr = getListArray(key);
        if(arr.length <= 1){ alert('يجب أن يبقى عنصر واحد على الأقل في القائمة'); return; }
        if(!confirm('حذف هذا العنصر من القائمة؟')) return;
        arr.splice(idx, 1);
        saveLists();
        render();
      };
    });
    document.querySelectorAll('[data-additem]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.additem;
        const input = document.querySelector(`[data-newitem="${key}"]`);
        const val = input.value.trim();
        if(!val) return;
        const arr = getListArray(key);
        if(arr.includes(val)){ alert('هذا العنصر موجود بالفعل'); return; }
        arr.push(val);
        saveLists();
        render();
      };
    });
    document.querySelectorAll('[data-addcountry]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.addcountry;
        const nameInput = document.querySelector(`[data-newcountryname="${key}"]`);
        const codeInput = document.querySelector(`[data-newcountrycode="${key}"]`);
        const name = nameInput.value.trim();
        let code = codeInput.value.trim();
        if(!name || !code) return;
        if(!code.startsWith('+')) code = '+' + code.replace(/\D/g,'');
        COUNTRIES.push({name, code});
        saveLists();
        render();
      };
    });
  }
  const reportExcelBtn = document.getElementById('exportReportExcelBtn');
  if(reportExcelBtn) reportExcelBtn.onclick = exportReportExcel;
}

document.getElementById('importFileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importDataFromFile(file);
  e.target.value = '';
});
document.getElementById('importExcelInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importClientsFromExcel(file);
  e.target.value = '';
});

/* ============== Robust close: click outside modal, or press Escape ============== */
document.querySelectorAll('.overlay').forEach(overlayEl=>{
  overlayEl.addEventListener('click', (e)=>{
    if(e.target === overlayEl){
      overlayEl.classList.add('hidden');
    }
  });
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    document.querySelectorAll('.overlay:not(.hidden)').forEach(overlayEl=>{
      overlayEl.classList.add('hidden');
    });
  }
});

/* ============== Init ============== */
loadData();
if(new URLSearchParams(location.search).get('public') === '1'){
  renderPublicForm();
}else if(new URLSearchParams(location.search).get('publicmeeting') === '1'){
  renderPublicMeetingForm();
}else{
  const savedUserId = localStorage.getItem('fcrm_logged_in_user');
  if(savedUserId && users.find(u=>u.id===savedUserId)){
    currentUserId = savedUserId;
    showApp();
  }else{
    showLogin();
  }
}
</script>
</body>
</html>
